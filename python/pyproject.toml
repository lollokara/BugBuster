[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugbuster"
version = "0.1.0"
description = "Python control library for the BugBuster AD74416H industrial I/O device"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pyserial>=3.5",
    "requests>=2.28",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
    "pydantic>=2.0",
]
network = [
    "zeroconf>=0.131",
    "websockets>=12",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # tests/pytest.ini declares a `timeout` marker; without this plugin every
    # such marker silently no-ops and a hung test hangs the whole run.
    "pytest-timeout>=2.3",
]
dev = [
    "bugbuster[mcp,network,test]",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
bugbuster-mcp = "bugbuster_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["bugbuster*", "bugbuster_mcp*"]
exclude = ["firmware_modules*", "examples*"]

[tool.coverage.run]
source = ["bugbuster", "bugbuster_mcp"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "bugbuster.egg-info",
    "firmware_modules",
]

[tool.ruff.lint]
# Deliberately narrow: F (pyflakes) and B (bugbear) catch real defects --
# undefined names, unused bindings, closures capturing a loop variable,
# unreachable except clauses. The tree is clean against these, so CI can gate
# on them today.
#
# The style families are NOT enabled yet: E/I/UP/SIM together flag ~630 more
# findings (printf-formatting, import order, `Optional[...]`, semicolons).
# Those are worth doing, but as one deliberate formatting sweep -- turning them
# on here would make every unrelated PR red.
select = ["F", "B", "E9"]
ignore = [
    "B008",  # FastMCP/argparse defaults are constructed in the signature by design
]

[tool.ruff.lint.per-file-ignores]
# Wire-layout tests bind names purely to document a struct field order.
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = "(bugbuster\\.egg-info|firmware_modules|examples)"

