name: bugbuster
options:
  bundleIdPrefix: com.lorenzo.bugbuster
  deploymentTarget:
    iOS: 26.0
fileGroups: []
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: BugBuster
      PRODUCT_BUNDLE_IDENTIFIER: com.lorenzo.bugbuster
targets:
  bugbuster_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: LaunchScreen.storyboard
      - path: assets
        buildPhase: resources
        type: folder
    entitlements:
      path: bugbuster.entitlements
      # MUST be declared here, not only in the .entitlements file on disk.
      # XcodeGen GENERATES this file: with a `path` but no `properties` it
      # writes an empty <dict/> over whatever is there, silently dropping the
      # hotspot entitlement. Without it NEHotspotConfigurationManager never
      # prompts to join the DAQ HAT hotspot, so the WiFi stream cannot start
      # at all — and nothing about the build fails, it just stops working
      # on device.
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
    info:
      path: Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1"
        NSCameraUsageDescription: "Scan QR code to connect to the BugBuster hardware device over Wi-Fi."
        NSLocalNetworkUsageDescription: "Access BugBuster hardware devices on your local network."
        NSBluetoothAlwaysUsageDescription: "Discover and control nearby BugBuster hardware over Bluetooth Low Energy."
        NSBluetoothPeripheralUsageDescription: "Connect to BugBuster hardware over Bluetooth Low Energy."
        NSBonjourServices:
          - _bugbuster._tcp
          - _http._tcp
    settings:
      base:
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: bugbuster.entitlements
        # Pinned here so `xcodegen generate` does not wipe it. Xcode writes the
        # signing team into project.pbxproj when you first build to a device,
        # but pbxproj is GENERATED from this file — regenerating without this
        # line silently drops the team and on-device install fails to sign.
        # Same class of trap as the hotspot entitlement above.
        DEVELOPMENT_TEAM: 6R87YR573L
      groups: [app]
    dependencies:
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework
      - sdk: Combine.framework
      - sdk: CoreBluetooth.framework
