[pytest]
pythonpath = .
markers =
    usb_only: test requires USB connection
    http_only: test requires HTTP connection
    requires_hat: test requires HAT expansion board
    destructive: test modifies device state (power, reset)
    slow: test takes > 5 seconds
    streaming: test requires USB streaming
    sim_only: test requires --sim flag (simulated device)
    timeout: per-test timeout in seconds (requires pytest-timeout)
    no_reset: skip the post-test reset_to_defaults() autouse fixture
    full_reset: force broad reset_to_defaults() cleanup after this test
    requires_daq: test requires the DAQ HAT (P4 USB-HS); needs --daq
    daq_wifi: test joins the DAQ softAP and takes this host off its network; needs --daq-wifi
    requires_daq_bbp: test needs BOTH the P4 stream (--daq) and the S3 control plane (--device-usb)
addopts = -v --tb=short --color=yes
testpaths = tests
