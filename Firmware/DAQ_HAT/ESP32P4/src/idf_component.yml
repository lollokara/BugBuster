## IDF component manager manifest for the DAQ HAT (ESP32-P4) firmware.
dependencies:
  idf: ">=5.3"
  espressif/esp_tinyusb: "^2.2"
  espressif/esp-dsp: "^1.5"
  # Host-side ESP ROM bootloader flasher: lets the P4 flash the on-module C6
  # over UART2 (BOOT/RST controlled), used by link/c6_flasher.c.
  espressif/esp-serial-flasher: "^2.0"
  # ESP-Hosted: makes the standard esp_wifi API work transparently over the
  # existing C6_SDIO_* pins (config.h), with the on-module C6 acting as the
  # WiFi radio co-processor (P4 has none). Matches Espressif's own
  # ESP32-P4-Function-EV-Board reference pinout exactly (CLK18/CMD19/D0-3
  # 14-17/RST54), so no pin remap is expected. pre_release required: no
  # stable esp_hosted release supports the P4 host yet. See
  # .mex/patterns/daq-hat-ios-wifi-streaming.md.
  #
  # PINNED, and it must stay pinned. `dependencies.lock` is gitignored, so CI
  # re-resolves on every build - with `version: "*"` plus pre_release that means
  # a component release can break the build with no commit to this repo, which
  # is exactly what happened on 2026-08-20. A newer esp_hosted propagates
  # `-include eh_host_port_master_config.h` to its dependents, and PlatformIO's
  # ESP-IDF builder runs the CMake compile fragments through SCons ParseFlags +
  # AppendUnique, which reorders them and separates `-include` from its
  # argument. The filename then lands on the gcc command line as a second input
  # file: "cannot specify '-o' with '-c' ... with multiple files", on every
  # src/ file. 2.12.12 scopes its `-include` PRIVATE to the lwip target, so it
  # never reaches our sources.
  #
  # Before bumping either pin, build the P4 on Linux - this failure does not
  # reproduce on Windows.
  espressif/esp_wifi_remote:
    version: "==1.6.3"
  espressif/esp_hosted:
    version: "==2.12.12"
    pre_release: true
