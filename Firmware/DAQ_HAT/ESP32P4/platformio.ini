; PlatformIO Project Configuration — DAQ HAT high-performance application processor
; Target: ESP32-P4
; Framework: ESP-IDF 5.5.4 (via pioarduino platform — P4 not yet in official espressif32)
; Platform tag scheme: <idf_major_minor>.<arduino_core>.<build>
; When framework = espidf, the Arduino layer is NOT used at all.
; P4 fix landed in 55.03.36-1; pinned to latest stable 55.03.39.

[env:esp32p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-p4-evboard
framework = espidf
monitor_speed = 115200

; SILICON REVISION — our fabricated DAQ HAT ships ESP32-P4 rev v1.3 (esp32p4-eco2
; ROM), i.e. PRE-rev3. It uses the SPLIT SRAM layout (sram_low / sram_high). The
; pioarduino builder selects the linker layout from chip_variant: "esp32p4" ->
; contiguous rev3 (sections.rev3.ld.in -> sram_seg); "esp32p4_es" -> split
; sections.ld.in (sram_low/sram_high). We MUST use the engineering-sample variant
; to match v1.3 silicon AND keep it in lockstep with CONFIG_ESP32P4_SELECTS_REV_
; LESS_V3=y / CONFIG_ESP32P4_REV_MIN_100 in sdkconfig.defaults. Forcing "esp32p4"
; here links the contiguous rev3 layout, which crashes v1.3 silicon with an
; illegal-instruction Guru Meditation at bootloader entry.
board_build.chip_variant = esp32p4_es

; Without this, PlatformIO's upload step falls back to the board default
; (default_16MB.csv, single factory app @ 0x10000) to compute the app flash
; offset, even though the actual ESP-IDF build already burns our custom
; partitions.csv (CONFIG_PARTITION_TABLE_CUSTOM_FILENAME, sdkconfig.defaults)
; with no factory partition and ota_0 @ 0x110000. That mismatch silently
; flashed the app 0x100000 bytes too early, clobbering nvs/otadata/phy_init
; and bricking a board into a reset loop. Keep this in lockstep with
; sdkconfig.defaults' CONFIG_PARTITION_TABLE_CUSTOM_FILENAME.
board_build.partitions = partitions.csv
board_build.flash_size = 16MB

build_flags = -DDAQ_HAT=1
              -DTARGET_P4=1
