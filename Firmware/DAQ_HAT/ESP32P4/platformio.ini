; PlatformIO Project Configuration — DAQ HAT high-performance application processor
; Target: ESP32-P4
; Framework: ESP-IDF 5.5.4 (via pioarduino platform — P4 not yet in official espressif32)
; Platform tag scheme: <idf_major_minor>.<arduino_core>.<build>
; When framework = espidf, the Arduino layer is NOT used at all.
; P4 fix landed in 55.03.36-1; pinned to latest stable 55.03.39.

[env:esp32p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-p4-evboard
framework = espidf
monitor_speed = 115200

; The esp32-p4-evboard manifest defaults to chip_variant "esp32p4_es" (engineering
; sample / pre-rev3). Our hardware ships PRODUCTION silicon (rev >= 3.0), so force
; the production variant. This makes the pioarduino builder select the contiguous
; rev3 linker layout (sections.rev3.ld.in -> sram_seg), matching CONFIG_ESP32P4_
; REV_MIN_301 in sdkconfig.esp32p4. Without this, the builder emits the split
; pre-rev3 sections.ld.in (sram_low/sram_high) and the link fails with undeclared
; memory regions / undefined _bss_start/_data_start/_heap_start.
board_build.chip_variant = esp32p4

build_flags = -DDAQ_HAT=1
              -DTARGET_P4=1
