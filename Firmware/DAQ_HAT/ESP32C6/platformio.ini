; PlatformIO Project Configuration — DAQ HAT wireless MCU
; Targets: ESP32-C3 (dev/test board) and ESP32-C6 (production target)
; Framework: ESP-IDF

[common]
framework = espidf
monitor_speed = 115200
build_flags = -DDAQ_HAT=1
; `build_src_filter` does NOT work for espidf-framework projects (PlatformIO
; warns "cannot be used with ESP-IDF" and ignores it) -- these scripts are the
; real fixes, see each one's docstring.
extra_scripts = pre:scripts/pio_clean_appledouble.py
                post:scripts/pio_stabilize_cmake_reconfigure.py

; ---------------------------------------------------------------------------
; ESP32-C3 — current test vehicle
; ---------------------------------------------------------------------------
[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
              -DTARGET_C3=1
extra_scripts = ${common.extra_scripts}
; wifi_hosted (vendored ESP-Hosted, shared codebase) outgrows the default
; 1 MB single-app table here too; board flash is 4 MB.
board_build.partitions = partitions.csv
board_build.flash_size = 4MB

; ---------------------------------------------------------------------------
; ESP32-C6 — production DAQ HAT target
; ---------------------------------------------------------------------------
[env:esp32c6]
platform = espressif32@6.9.0
board = esp32-c6-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
              -DTARGET_C6=1
extra_scripts = ${common.extra_scripts}
; wifi_hosted (vendored ESP-Hosted) outgrew the board def's default 1 MB
; single-app table. Production C6 hardware has 8 MB flash, so give it a
; roomier dedicated table (partitions_c6.csv) instead of the 4 MB one shared
; with the C3 dev board. Both PlatformIO's own size check and the ESP-IDF
; build need to agree (board_build.* here + CONFIG_PARTITION_TABLE_CUSTOM_FILENAME
; / CONFIG_ESPTOOLPY_FLASHSIZE_8MB below), or checkprogsize fails even when
; the real ESP-IDF partition table is already correct.
board_build.partitions = partitions_c6.csv
board_build.flash_size = 8MB
custom_sdkconfig =
	CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y
	CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions_c6.csv"
