; PlatformIO Project Configuration — DAQ HAT wireless MCU
; Targets: ESP32-C3 (dev/test board) and ESP32-C6 (production target)
; Framework: ESP-IDF

[common]
framework = espidf
monitor_speed = 115200
build_flags = -DDAQ_HAT=1

; ---------------------------------------------------------------------------
; ESP32-C3 — current test vehicle
; ---------------------------------------------------------------------------
[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
              -DTARGET_C3=1

; ---------------------------------------------------------------------------
; ESP32-C6 — production DAQ HAT target
; ---------------------------------------------------------------------------
[env:esp32c6]
platform = espressif32@6.9.0
board = esp32-c6-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags = ${common.build_flags}
              -DTARGET_C6=1
