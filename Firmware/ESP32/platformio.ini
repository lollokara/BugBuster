; PlatformIO Project Configuration
; AD74416H Controller on ESP32-S3 N16R8 (16 MB flash + 8 MB octal PSRAM)
; Framework: ESP-IDF (migrated from Arduino)

[env:esp32s3]
platform = espressif32@6.9.0
board = dfrobot_firebeetle2_esp32s3
framework = espidf

; Serial monitor
monitor_speed = 921600
; Ports — update for your OS (macOS: /dev/cu.usbmodem*, Windows: COMx).
; The flash-manager notebook (section 4) auto-detects and passes --upload-port,
; so these only matter when running `pio run -t upload` directly from the CLI.
upload_port = /dev/cu.usbmodem1234563
monitor_port = /dev/cu.usbmodem1234561

; Partition table with SPIFFS for web files
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
extra_scripts = pre:scripts/pio_webfs_partition.py
                post:../tools/check_memory.py

; Override the stock Firebeetle2 board (4 MB) to match the N16R8 module on the PCB.
; PSRAM is enabled via sdkconfig.defaults (CONFIG_SPIRAM_MODE_OCT=y).
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi

build_flags = -DBB_IO_OWNERSHIP=1
