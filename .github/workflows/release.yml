name: Combined Release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without leading v), e.g. 1.0.0"
        required: true
  push:
    branches:
      - main
    tags:
      - "release-v*"

permissions:
  contents: write

concurrency:
  group: combined-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prep:
    name: Prepare Release Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      version_suffix: ${{ steps.version.outputs.version_suffix }}
      build_rp2040: ${{ steps.diff.outputs.build_rp2040 }}
      build_esp32: ${{ steps.diff.outputs.build_esp32 }}
      build_desktop: ${{ steps.diff.outputs.build_desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0  # Fetch all history to ensure previous commit is available for diff

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.x"

      - name: Resolve version and tag
        id: version
        shell: bash
        run: |
          base_version=$(python DesktopApp/BugBuster/scripts/desktop_version.py --check)
          if [[ "$GITHUB_REF" == refs/tags/release-v* ]]; then
            version="${GITHUB_REF_NAME#release-v}"
            tag="$GITHUB_REF_NAME"
            is_prerelease="false"
            version_suffix=""
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
            tag="release-v${version}"
            is_prerelease="false"
            version_suffix=""
          else
            # Push to main
            # Use GitHub run number for a clean, numeric pre-release identifier <= 65535 (required by Windows MSI)
            version_suffix="_build${{ github.run_number }}"
            version="${base_version}${version_suffix}"
            tag="nightly"
            is_prerelease="true"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "version_suffix=$version_suffix" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=$version tag=$tag is_prerelease=$is_prerelease version_suffix=$version_suffix"

      - name: Check which components need building
        id: diff
        shell: bash
        run: |
          build_rp2040="true"
          build_esp32="true"
          build_desktop="true"
          
          # Only check for skipped builds if this is a push to main (prerelease)
          if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
            if git rev-parse --verify "${{ github.event.before }}" >/dev/null 2>&1; then
              echo "Checking git diff between ${{ github.event.before }} and HEAD"
              
              if git diff --quiet "${{ github.event.before }}" HEAD -- Firmware/RP2040/ Firmware/tools/firmware_version.py .github/workflows/rp2040-firmware.yml; then
                build_rp2040="false"
                echo "No RP2040 changes detected. Skipping build."
              fi
              
              if git diff --quiet "${{ github.event.before }}" HEAD -- Firmware/ESP32/ Firmware/tools/firmware_version.py .github/workflows/esp32-firmware.yml; then
                build_esp32="false"
                echo "No ESP32 changes detected. Skipping build."
              fi
              
              if git diff --quiet "${{ github.event.before }}" HEAD -- DesktopApp/BugBuster/ .github/workflows/desktop-release.yml; then
                build_desktop="false"
                echo "No Desktop changes detected. Skipping build."
              fi
            else
              echo "Previous commit is not available, building all components."
            fi
          else
            echo "Official release build, compiling all components."
          fi
          
          echo "build_rp2040=$build_rp2040" >> "$GITHUB_OUTPUT"
          echo "build_esp32=$build_esp32" >> "$GITHUB_OUTPUT"
          echo "build_desktop=$build_desktop" >> "$GITHUB_OUTPUT"

  rp2040:
    name: Build RP2040
    needs: prep
    if: needs.prep.outputs.build_rp2040 == 'true'
    uses: ./.github/workflows/rp2040-firmware.yml
    with:
      version_suffix: ${{ needs.prep.outputs.version_suffix }}
    secrets: inherit

  esp32:
    name: Build ESP32
    needs: prep
    if: needs.prep.outputs.build_esp32 == 'true'
    uses: ./.github/workflows/esp32-firmware.yml
    with:
      version_suffix: ${{ needs.prep.outputs.version_suffix }}
    secrets: inherit

  desktop:
    name: Build Desktop
    needs: prep
    if: needs.prep.outputs.build_desktop == 'true'
    uses: ./.github/workflows/desktop-release.yml
    with:
      version_suffix: ${{ needs.prep.outputs.version_suffix }}
    secrets: inherit

  publish:
    name: Publish combined release
    needs: [prep, rp2040, esp32, desktop]
    if: always() && (needs.prep.result == 'success') && (needs.rp2040.result == 'success' || needs.rp2040.result == 'skipped') && (needs.esp32.result == 'success' || needs.esp32.result == 'skipped') && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.x"

      - name: Download RP2040 artifacts
        if: needs.prep.outputs.build_rp2040 == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: rp2040-firmware-*
          path: dist/rp2040
          merge-multiple: true

      - name: Download ESP32 artifacts
        if: needs.prep.outputs.build_esp32 == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: esp32-firmware-*
          path: dist/esp32
          merge-multiple: true

      - name: Download Desktop artifacts
        if: needs.prep.outputs.build_desktop == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: bugbuster-desktop-*
          path: dist/desktop
          merge-multiple: true

      - name: Fetch previous release assets (if any skipped)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          build_rp2040="${{ needs.prep.outputs.build_rp2040 }}"
          build_esp32="${{ needs.prep.outputs.build_esp32 }}"
          build_desktop="${{ needs.prep.outputs.build_desktop }}"
          
          if [ "$build_rp2040" = "false" ] || [ "$build_esp32" = "false" ] || [ "$build_desktop" = "false" ]; then
            echo "Looking for cached assets from a previous release..."
            mkdir -p dist/prev_release

            release_has_required_assets() {
              local tag="$1"
              local asset_names

              asset_names="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)"
              [ -n "$asset_names" ] || return 1

              if [ "$build_rp2040" = "false" ] && ! printf '%s\n' "$asset_names" | grep -Eq '^bugbuster-hat-rp2040-v.*\.(bin|uf2|hex|elf|dis|bundle\.zip|checksums\.txt)$'; then
                return 1
              fi

              if [ "$build_esp32" = "false" ] && ! printf '%s\n' "$asset_names" | grep -Eq '^bugbuster-esp32s3-v.*-ota\.bin$'; then
                return 1
              fi

              if [ "$build_desktop" = "false" ] && ! printf '%s\n' "$asset_names" | grep -Eq '^(bugbuster[_-].*\.(dmg|AppImage|deb|rpm|msi)|bugbuster[_-].*-setup\.exe|bugbuster\.app\.tar\.gz|bugbuster\.app\.tar\.gz\.sig)$'; then
                return 1
              fi

              return 0
            }

            download_release_assets() {
              local tag="$1"
              rm -rf dist/prev_release
              mkdir -p dist/prev_release
              gh release download "$tag" --dir dist/prev_release --pattern "*"
            }

            if release_has_required_assets nightly; then
              echo "Downloading assets from previous nightly release..."
              download_release_assets nightly
            else
              echo "Searching recent releases for a complete cached asset set..."
              found_tag=""
              while IFS= read -r tag; do
                [ -n "$tag" ] || continue
                [ "$tag" = "nightly" ] && continue
                if release_has_required_assets "$tag"; then
                  found_tag="$tag"
                  break
                fi
              done < <(
                gh release list --limit 50 --json tagName,publishedAt \
                  | python -c 'import json, sys; releases = json.load(sys.stdin); releases.sort(key=lambda item: item.get("publishedAt", ""), reverse=True); [print(release["tagName"]) for release in releases]'
              )

              if [ -n "$found_tag" ]; then
                echo "Downloading assets from previous release $found_tag..."
                download_release_assets "$found_tag"
              else
                echo "::error::No previous release contains all required cached assets for the skipped components."
                exit 1
              fi
            fi
          fi

      - name: Stage release assets
        id: stage
        shell: bash
        run: |
          mkdir -p dist/release
          build_rp2040="${{ needs.prep.outputs.build_rp2040 }}"
          build_esp32="${{ needs.prep.outputs.build_esp32 }}"
          build_desktop="${{ needs.prep.outputs.build_desktop }}"

          # RP2040 staging
          if [ "$build_rp2040" = "true" ]; then
            if [ -d dist/rp2040 ]; then
              cp -rv dist/rp2040/* dist/release/ || true
            fi
          elif [ -d dist/prev_release ]; then
            echo "Copying cached RP2040 assets..."
            cp -v dist/prev_release/*rp2040* dist/release/ 2>/dev/null || true
            cp -v dist/prev_release/*bugbuster-hat* dist/release/ 2>/dev/null || true
          fi

          # ESP32 staging
          if [ "$build_esp32" = "true" ]; then
            if [ -d dist/esp32 ]; then
              cp -rv dist/esp32/* dist/release/ || true
            fi
          elif [ -d dist/prev_release ]; then
            echo "Copying cached ESP32 assets..."
            cp -v dist/prev_release/*esp32s3* dist/release/ 2>/dev/null || true
          fi

          # Desktop staging
          if [ "$build_desktop" = "true" ]; then
            shopt -s globstar nullglob
            desktop_files=(
              dist/desktop/**/*.dmg
              dist/desktop/**/*.AppImage
              dist/desktop/**/*.deb
              dist/desktop/**/*.rpm
              dist/desktop/**/*.msi
              dist/desktop/**/*-setup.exe
              dist/desktop/**/*.app.tar.gz
              dist/desktop/**/*.app.tar.gz.sig
            )
            desktop_count=0
            for f in "${desktop_files[@]}"; do
              [ -f "$f" ] || continue
              cp -v "$f" "dist/release/"
              desktop_count=$((desktop_count + 1))
            done
            echo "Staged $desktop_count new desktop bundle file(s)."
          elif [ -d dist/prev_release ]; then
            echo "Copying cached Desktop assets..."
            desktop_count=0
            for ext in dmg AppImage deb rpm msi exe app.tar.gz app.tar.gz.sig; do
              if [ "$ext" = "exe" ]; then
                cp -v dist/prev_release/*-setup.exe dist/release/ 2>/dev/null && desktop_count=$((desktop_count + 1)) || true
              else
                cp -v dist/prev_release/*."$ext" dist/release/ 2>/dev/null && desktop_count=$((desktop_count + 1)) || true
              fi
            done
            echo "Staged $desktop_count cached desktop bundle file(s)."
          fi

          # Rename any staged desktop assets to replace -<run_number> or -build with _build
          for f in dist/release/*; do
            if [[ -f "$f" ]]; then
              new_f=$(echo "$f" | sed -E "s/-([0-9]+)/_build\1/" | sed "s/-build/_build/")
              if [ "$f" != "$new_f" ]; then
                mv -v "$f" "$new_f"
              fi
            fi
          done

          # Verify that staging folder is not empty
          # (Remove any previous SHA256SUMS.txt from copied assets to regenerate fresh)
          rm -f dist/release/SHA256SUMS.txt
          
          if [ -n "$(ls -A dist/release/ 2>/dev/null)" ]; then
            ( cd dist/release && sha256sum ./* > SHA256SUMS.txt )
          python - <<'PY'
          import glob
          import hashlib
          import json
          import os
          import re
          import zlib

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = "${{ needs.prep.outputs.tag }}"
          run_number = os.environ["GITHUB_RUN_NUMBER"]
          sha = os.environ["GITHUB_SHA"]
          base = f"https://github.com/{repo}/releases/download/{tag}"

          def pick(patterns):
              for pattern in patterns:
                  matches = sorted(glob.glob(os.path.join("dist/release", pattern)))
                  if matches:
                      return matches[0]
              raise SystemExit(f"missing release asset for {patterns}")

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          def crc32(path):
              c = 0
              with open(path, "rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      c = zlib.crc32(block, c)
              return c & 0xFFFFFFFF

          def version_from_name(path, regex):
              name = os.path.basename(path)
              m = re.search(regex, name)
              return m.group(1) if m else ""

          rp = pick(["bugbuster-hat-rp2040-v*.bin"])
          esp = pick(["bugbuster-esp32s3-v*-ota.bin"])
          rp_name = os.path.basename(rp)
          esp_name = os.path.basename(esp)
          rp_ver = version_from_name(rp, r"bugbuster-hat-rp2040-v(.+)\.bin")
          esp_ver = version_from_name(esp, r"bugbuster-esp32s3-v(.+)-ota\.bin")

          manifest = {
              "schemaVersion": 1,
              "channel": "nightly" if tag == "nightly" else "release",
              "repo": repo,
              "commit": sha,
              "githubRunNumber": int(run_number),
              "buildId": f"{tag}.{run_number}.{sha[:12]}",
              "rp2040": {
                  "buildId": f"{rp_ver}+{run_number}.{sha[:12]}",
                  "version": rp_ver,
                  "asset": rp_name,
                  "url": f"{base}/{rp_name}",
                  "size": os.path.getsize(rp),
                  "sha256": sha256(rp),
                  "crc32": crc32(rp),
              },
              "esp32": {
                  "buildId": f"{esp_ver}+{run_number}.{sha[:12]}",
                  "version": esp_ver,
                  "asset": esp_name,
                  "url": f"{base}/{esp_name}",
                  "size": os.path.getsize(esp),
                  "sha256": sha256(esp),
              },
          }
          out = "dist/release/bugbuster-update-manifest.json"
          with open(out, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
            ( cd dist/release && sha256sum ./* > SHA256SUMS.txt )
            echo "Release assets staged:"
            ls -la dist/release/
          else
            echo "::error::No release assets staged! dist/release is empty."
            exit 1
          fi

      - name: Publish combined GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ needs.prep.outputs.tag }}"
          version="${{ needs.prep.outputs.version }}"
          is_prerelease="${{ needs.prep.outputs.is_prerelease }}"
          
          rp2040=$(python Firmware/tools/firmware_version.py rp2040)
          esp32=$(python Firmware/tools/firmware_version.py esp32)
          desktop=$(python DesktopApp/BugBuster/scripts/desktop_version.py --check)

          notes=$(cat <<EOF
          BugBuster combined release **v${version}**.

          Component versions in this bundle:

          - **Desktop App**: v${desktop}
          - **ESP32 Firmware**: v${esp32}
          - **RP2040 HAT Firmware**: v${rp2040}

          See \`SHA256SUMS.txt\` for asset checksums.
          EOF
          )

          # Delete previous rolling release if we are updating nightly.
          # Also keep the latest three archived nightly builds for rollback.
          if [ "$is_prerelease" = "true" ]; then
            echo "Deleting previous nightly release and tag to avoid file accumulation..."
            gh release delete nightly --cleanup-tag -y || true
            # Allow some time for tag deletion to propagate on GitHub
            sleep 3
            
            # Create a fresh prerelease
            gh release create nightly dist/release/* \
              --prerelease \
              --title "BugBuster Nightly v${version}" \
              --notes "$notes"

            archive_tag="nightly-build${GITHUB_RUN_NUMBER}"
            echo "Publishing archived nightly release ${archive_tag}..."
            gh release delete "$archive_tag" --cleanup-tag -y || true
            rm -rf dist/archive
            mkdir -p dist/archive
            cp -R dist/release/. dist/archive/
            ARCHIVE_TAG="$archive_tag" python -c 'import textwrap; exec(textwrap.dedent(r"""
            import json
            import os

            archive_tag = os.environ["ARCHIVE_TAG"]
            manifest_path = "dist/archive/bugbuster-update-manifest.json"
            if os.path.exists(manifest_path):
                with open(manifest_path, "r", encoding="utf-8") as f:
                    manifest = json.load(f)
                for component in ("rp2040", "esp32"):
                    asset = manifest.get(component, {}).get("asset")
                    if asset:
                        repo = manifest["repo"]
                        manifest[component]["url"] = (
                            f"https://github.com/{repo}/releases/download/{archive_tag}/{asset}"
                        )
                with open(manifest_path, "w", encoding="utf-8") as f:
                    json.dump(manifest, f, indent=2, sort_keys=True)
                    f.write("\n")
            """))'
            ( cd dist/archive && rm -f SHA256SUMS.txt && sha256sum ./* > SHA256SUMS.txt )
            gh release create "$archive_tag" dist/archive/* \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "BugBuster Nightly Archive v${version}" \
              --notes "$notes"

            echo "Pruning archived nightly releases, keeping the latest 3..."
            gh release list --limit 100 --json tagName,createdAt \
              | python -c 'import textwrap; exec(textwrap.dedent(r"""
            import json
            import re
            import sys

            releases = json.load(sys.stdin)
            archived = [
                release
                for release in releases
                if re.fullmatch(r"nightly-build[0-9]+", release.get("tagName", ""))
            ]
            archived.sort(key=lambda release: release.get("createdAt", ""), reverse=True)
            for release in archived[3:]:
                print(release["tagName"])
            """))' \
              | while IFS= read -r old_tag; do
                  [ -n "$old_tag" ] || continue
                  echo "Deleting archived nightly ${old_tag}..."
                  gh release delete "$old_tag" --cleanup-tag -y || true
                done
          else
            # Official release (from tag release-v* or manual dispatch with version)
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/release/* --clobber
            else
              gh release create "$tag" dist/release/* \
                --draft \
                --title "BugBuster v${version}" \
                --notes "$notes"
            fi
          fi
