name: Combined Release

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without leading v), e.g. 1.0.0"
        required: true
  push:
    branches:
      - main
    tags:
      - "release-v*"

permissions:
  contents: write

concurrency:
  group: combined-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prep:
    name: Prepare Release Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      version_suffix: ${{ steps.version.outputs.version_suffix }}
      build_rp2040: ${{ steps.diff.outputs.build_rp2040 }}
      build_esp32: ${{ steps.diff.outputs.build_esp32 }}
      build_desktop: ${{ steps.diff.outputs.build_desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0  # Fetch all history to ensure previous commit is available for diff

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.x"

      - name: Resolve version and tag
        id: version
        shell: bash
        run: |
          base_version=$(python DesktopApp/BugBuster/scripts/desktop_version.py --check)
          if [[ "$GITHUB_REF" == refs/tags/release-v* ]]; then
            version="${GITHUB_REF_NAME#release-v}"
            tag="$GITHUB_REF_NAME"
            is_prerelease="false"
            version_suffix=""
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
            tag="release-v${version}"
            is_prerelease="false"
            version_suffix=""
          else
            # Push to main
            timestamp=$(date +'%Y%m%d%H%M%S')
            version_suffix="_build${timestamp}"
            version="${base_version}${version_suffix}"
            tag="nightly"
            is_prerelease="true"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "version_suffix=$version_suffix" >> "$GITHUB_OUTPUT"
          echo "Resolved: version=$version tag=$tag is_prerelease=$is_prerelease version_suffix=$version_suffix"

      - name: Check which components need building
        id: diff
        shell: bash
        run: |
          build_rp2040="true"
          build_esp32="true"
          build_desktop="true"
          
          # Only check for skipped builds if this is a push to main (prerelease)
          if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
            if git rev-parse --verify "${{ github.event.before }}" >/dev/null 2>&1; then
              echo "Checking git diff between ${{ github.event.before }} and HEAD"
              
              if git diff --quiet "${{ github.event.before }}" HEAD -- Firmware/RP2040/ Firmware/tools/firmware_version.py .github/workflows/rp2040-firmware.yml; then
                build_rp2040="false"
                echo "No RP2040 changes detected. Skipping build."
              fi
              
              if git diff --quiet "${{ github.event.before }}" HEAD -- Firmware/ESP32/ Firmware/tools/firmware_version.py .github/workflows/esp32-firmware.yml; then
                build_esp32="false"
                echo "No ESP32 changes detected. Skipping build."
              fi
              
              if git diff --quiet "${{ github.event.before }}" HEAD -- DesktopApp/BugBuster/ .github/workflows/desktop-release.yml; then
                build_desktop="false"
                echo "No Desktop changes detected. Skipping build."
              fi
            else
              echo "Previous commit is not available, building all components."
            fi
          else
            echo "Official release build, compiling all components."
          fi
          
          echo "build_rp2040=$build_rp2040" >> "$GITHUB_OUTPUT"
          echo "build_esp32=$build_esp32" >> "$GITHUB_OUTPUT"
          echo "build_desktop=$build_desktop" >> "$GITHUB_OUTPUT"

  rp2040:
    name: Build RP2040
    needs: prep
    if: needs.prep.outputs.build_rp2040 == 'true'
    uses: ./.github/workflows/rp2040-firmware.yml
    with:
      version_suffix: ${{ needs.prep.outputs.version_suffix }}
    secrets: inherit

  esp32:
    name: Build ESP32
    needs: prep
    if: needs.prep.outputs.build_esp32 == 'true'
    uses: ./.github/workflows/esp32-firmware.yml
    with:
      version_suffix: ${{ needs.prep.outputs.version_suffix }}
    secrets: inherit

  desktop:
    name: Build Desktop
    needs: prep
    if: needs.prep.outputs.build_desktop == 'true'
    uses: ./.github/workflows/desktop-release.yml
    with:
      version_suffix: ${{ needs.prep.outputs.version_suffix }}
    secrets: inherit

  publish:
    name: Publish combined release
    needs: [prep, rp2040, esp32, desktop]
    if: always() && (needs.prep.result == 'success') && (needs.rp2040.result == 'success' || needs.rp2040.result == 'skipped') && (needs.esp32.result == 'success' || needs.esp32.result == 'skipped') && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.x"

      - name: Download RP2040 artifacts
        if: needs.prep.outputs.build_rp2040 == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: rp2040-firmware-*
          path: dist/rp2040
          merge-multiple: true

      - name: Download ESP32 artifacts
        if: needs.prep.outputs.build_esp32 == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: esp32-firmware-*
          path: dist/esp32
          merge-multiple: true

      - name: Download Desktop artifacts
        if: needs.prep.outputs.build_desktop == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: bugbuster-desktop-*
          path: dist/desktop
          merge-multiple: true

      - name: Fetch previous release assets (if any skipped)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          build_rp2040="${{ needs.prep.outputs.build_rp2040 }}"
          build_esp32="${{ needs.prep.outputs.build_esp32 }}"
          build_desktop="${{ needs.prep.outputs.build_desktop }}"
          
          if [ "$build_rp2040" = "false" ] || [ "$build_esp32" = "false" ] || [ "$build_desktop" = "false" ]; then
            echo "Downloading assets from previous nightly release..."
            mkdir -p dist/prev_release
            # Ignore failure if the release does not exist yet
            gh release download nightly --dir dist/prev_release --pattern "*" || echo "No previous nightly release found."
          fi

      - name: Stage release assets
        id: stage
        shell: bash
        run: |
          mkdir -p dist/release
          build_rp2040="${{ needs.prep.outputs.build_rp2040 }}"
          build_esp32="${{ needs.prep.outputs.build_esp32 }}"
          build_desktop="${{ needs.prep.outputs.build_desktop }}"

          # RP2040 staging
          if [ "$build_rp2040" = "true" ]; then
            if [ -d dist/rp2040 ]; then
              cp -rv dist/rp2040/* dist/release/ || true
            fi
          elif [ -d dist/prev_release ]; then
            echo "Copying cached RP2040 assets..."
            cp -v dist/prev_release/*rp2040* dist/release/ 2>/dev/null || true
            cp -v dist/prev_release/*bugbuster-hat* dist/release/ 2>/dev/null || true
          fi

          # ESP32 staging
          if [ "$build_esp32" = "true" ]; then
            if [ -d dist/esp32 ]; then
              cp -rv dist/esp32/* dist/release/ || true
            fi
          elif [ -d dist/prev_release ]; then
            echo "Copying cached ESP32 assets..."
            cp -v dist/prev_release/*esp32s3* dist/release/ 2>/dev/null || true
          fi

          # Desktop staging
          if [ "$build_desktop" = "true" ]; then
            shopt -s globstar nullglob
            desktop_files=(
              dist/desktop/**/*.dmg
              dist/desktop/**/*.AppImage
              dist/desktop/**/*.deb
              dist/desktop/**/*.rpm
              dist/desktop/**/*.msi
              dist/desktop/**/*-setup.exe
              dist/desktop/**/*.app.tar.gz
              dist/desktop/**/*.app.tar.gz.sig
            )
            desktop_count=0
            for f in "${desktop_files[@]}"; do
              [ -f "$f" ] || continue
              cp -v "$f" "dist/release/"
              desktop_count=$((desktop_count + 1))
            done
            echo "Staged $desktop_count new desktop bundle file(s)."
          elif [ -d dist/prev_release ]; then
            echo "Copying cached Desktop assets..."
            desktop_count=0
            for ext in dmg AppImage deb rpm msi exe app.tar.gz app.tar.gz.sig; do
              if [ "$ext" = "exe" ]; then
                cp -v dist/prev_release/*-setup.exe dist/release/ 2>/dev/null && desktop_count=$((desktop_count + 1)) || true
              else
                cp -v dist/prev_release/*."$ext" dist/release/ 2>/dev/null && desktop_count=$((desktop_count + 1)) || true
              fi
            done
            echo "Staged $desktop_count cached desktop bundle file(s)."
          fi

          # Rename any staged desktop assets to replace -build with _build
          for f in dist/release/*; do
            if [[ -f "$f" ]]; then
              new_f=$(echo "$f" | sed "s/-build/_build/")
              if [ "$f" != "$new_f" ]; then
                mv -v "$f" "$new_f"
              fi
            fi
          done

          # Verify that staging folder is not empty
          # (Remove any previous SHA256SUMS.txt from copied assets to regenerate fresh)
          rm -f dist/release/SHA256SUMS.txt
          
          if [ -n "$(ls -A dist/release/ 2>/dev/null)" ]; then
            ( cd dist/release && sha256sum ./* > SHA256SUMS.txt )
            echo "Release assets staged:"
            ls -la dist/release/
          else
            echo "::error::No release assets staged! dist/release is empty."
            exit 1
          fi

      - name: Publish combined GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ needs.prep.outputs.tag }}"
          version="${{ needs.prep.outputs.version }}"
          is_prerelease="${{ needs.prep.outputs.is_prerelease }}"
          
          rp2040=$(python Firmware/tools/firmware_version.py rp2040)
          esp32=$(python Firmware/tools/firmware_version.py esp32)
          desktop=$(python DesktopApp/BugBuster/scripts/desktop_version.py --check)

          notes=$(cat <<EOF
          BugBuster combined release **v${version}**.

          Component versions in this bundle:

          - **Desktop App**: v${desktop}
          - **ESP32 Firmware**: v${esp32}
          - **RP2040 HAT Firmware**: v${rp2040}

          See \`SHA256SUMS.txt\` for asset checksums.
          EOF
          )

          # Delete previous rolling release if we are updating nightly
          if [ "$is_prerelease" = "true" ]; then
            echo "Deleting previous nightly release and tag to avoid file accumulation..."
            gh release delete nightly --cleanup-tag -y || true
            # Allow some time for tag deletion to propagate on GitHub
            sleep 3
            
            # Create a fresh prerelease
            gh release create nightly dist/release/* \
              --prerelease \
              --title "BugBuster Nightly v${version}" \
              --notes "$notes"
          else
            # Official release (from tag release-v* or manual dispatch with version)
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/release/* --clobber
            else
              gh release create "$tag" dist/release/* \
                --draft \
                --title "BugBuster v${version}" \
                --notes "$notes"
            fi
          fi
