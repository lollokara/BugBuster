name: Python Tests

# Nothing in CI ran pytest until 2026-08-03. The unit, synthetic and simulator
# suites all existed and were runnable locally, but no workflow invoked them --
# so four tests sat failing in the tree undetected (two of which were the
# symptom of a real cross-surface MUX-routing divergence, and two of which had
# never passed since the day they were written).
#
# These suites need no hardware: tests/device runs against the simulator with
# --sim. Hardware-gated tests are selected by --hat / --device-usb and stay out
# of CI.
#
# See docs/superpowers/reviews/2026-08-03-design-sweep.md finding S1-9.

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (unit + synthetic + simulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Dependencies only -- the suites import via PYTHONPATH=python, the
          # same way AGENTS.md documents running them locally. Installing the
          # package itself is avoided because python/bugbuster.egg-info is
          # committed to the repo and breaks a fresh `pip install ./python`.
          python -m pip install -r python/requirements.txt
          # tests/unit/test_mcp_*.py import bugbuster_mcp (mcp, pydantic);
          # discovery/transport tests need zeroconf/websockets.
          python -m pip install pytest mcp pydantic zeroconf websockets

      - name: Unit tests
        run: PYTHONPATH=python python -m pytest tests/unit -q

      - name: Synthetic regression tests
        run: PYTHONPATH=python python -m pytest tests/synthetic -q

      - name: Simulator device tests
        run: PYTHONPATH=python python -m pytest tests/device --sim -q
