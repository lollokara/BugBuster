name: Desktop Tests

# The desktop backend has ~130 Rust unit tests that no workflow ran until
# 2026-10-01; one of them (daq_proto::status_perf_extension) had been failing
# on main unnoticed. This job runs them on every push.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    name: cargo test (src-tauri)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6.0.2

      # Same package list as desktop-release.yml; Tauri links webkit/gtk even
      # for unit tests.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libudev-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b  # stable as of 2026-05
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            DesktopApp/BugBuster/target
          # No Cargo.lock is committed; key on the manifests.
          key: cargo-test-${{ runner.os }}-${{ hashFiles('DesktopApp/BugBuster/**/Cargo.toml') }}

      - name: cargo test
        run: cargo test --manifest-path DesktopApp/BugBuster/src-tauri/Cargo.toml --lib
